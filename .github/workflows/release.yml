name: Release binaries
on:
  push:
    tags: ['fzfp-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: Validate release tag and source version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^fzfp-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#fzfp-v}"
          test "$(sed -n 's/^var version = "\(.*\)"/\1/p' main.go)" = "$version"
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          # Push both tags atomically after the gate. SwiftPM needs SemVer.
          test "$(git rev-parse "$version^{commit}")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          echo "FZFP_VERSION=$version" >> "$GITHUB_ENV"
      - run: make -f Makefile.fzfp check
      - name: Build, inspect and publish four archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HEAD also has the SwiftPM SemVer tag; never auto-select that release.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          GOPATH: ${{ github.workspace }}/.cache/go
        # Custom fzfp-v tags are validated above: GoReleaser expects bare semver.
        # Each post-build hook checks strings; the Linux amd64 hook runs pinyin.
        run: go run github.com/goreleaser/goreleaser/v2@v2.20.0 release --clean --skip=validate
      - name: Verify published archives and rerun Linux binary checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$work" \
            --pattern checksums.txt --pattern 'fzfp-*.tar.gz'
          sh scripts/verify-archives.sh "$work" "$FZFP_VERSION"
          tar -xzf "$work/fzfp-$FZFP_VERSION-linux_amd64.tar.gz" -C "$work" fzfp
          sh scripts/verify-binary.sh "$work/fzfp" linux amd64
      - name: Install released binary with standalone Linux installer
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          HOME="$work/home" sh install-fzfp --version "$FZFP_VERSION" --bin-dir "$work/bin"
          test "$("$work/bin/fzfp" --version)" = "fzfp $FZFP_VERSION (based on fzf 0.75)"
          test "$(printf '北京\n上海\n' | "$work/bin/fzfp" -f bj)" = 北京
          "$work/bin/fzfp" --version
          echo 'Standalone Linux installation and pinyin filter passed'
  swift:
    needs: release
    runs-on: macos-15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify and publish the reviewed Swift archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#fzfp-v}"
          test "$version" = "$(python3 -c 'import json; print(json.load(open(".github/swift-release.json"))["version"])')"
          test "$(git rev-parse "$version^{commit}")" = "$(git rev-parse HEAD)"
          run_id="$(python3 -c 'import json; print(json.load(open(".github/swift-release.json"))["run_id"])')"
          source_commit="$(python3 -c 'import json; print(json.load(open(".github/swift-release.json"))["source_commit"])')"
          test "$(gh run view "$run_id" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$run_id" --json headSha --jq .headSha)" = "$source_commit"
          gh run download "$run_id" --name "swift-$version" --dir .cache/reviewed-swift
          python3 scripts/swift-release.py verify --directory .cache/reviewed-swift
          # No rebuild and no --clobber: publish precisely the bytes in Package.swift.
          gh release upload "$GITHUB_REF_NAME" .cache/reviewed-swift/CFzfp.xcframework.zip \
            .cache/reviewed-swift/CFzfp.xcframework.zip.sha256 .cache/reviewed-swift/CFzfp.provenance.json
      - name: Resolve and test a clean remote SwiftPM consumer
        run: bash scripts/test-swift-consumer.sh remote
