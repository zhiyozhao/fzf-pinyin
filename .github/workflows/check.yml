name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make -f Makefile.fzfp check
      - name: Verify upstream Makefile and default build
        env:
          GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
          GOPATH: ${{ github.workspace }}/.cache/go
        run: |
          git show bf4869b7fa7748d973eeb414da4dde0d7fe4cd3c:Makefile | cmp - Makefile
          test ! -e Makefile.fzf
          # The upstream base has no reachable version tag after history cleanup.
          make all FZF_VERSION=0.75
