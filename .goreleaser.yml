version: 2
project_name: fzfp
dist: Artifacts/dist
builds:
  - id: fzfp
    binary: fzfp
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - '-s -w -X main.version={{ .Env.FZFP_VERSION }}{{ if .IsSnapshot }}-snapshot{{ end }} -X main.revision='
    hooks:
      post: 'sh scripts/verify-binary.sh {{ .Path }} {{ .Os }} {{ .Arch }}'
archives:
  - ids: [fzfp]
    formats: [tar.gz]
    name_template: 'fzfp-{{ .Env.FZFP_VERSION }}{{ if .IsSnapshot }}-snapshot{{ end }}-{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - src: man/man1/fzfp.1
        dst: .
        strip_parent: true
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ .Env.FZFP_VERSION }}-snapshot'
release:
  github:
    owner: zhiyozhao
    name: fzf-pinyin
  name_template: 'fzfp {{ .Env.FZFP_VERSION }}'
  draft: false
  prerelease: false
changelog:
  disable: true
